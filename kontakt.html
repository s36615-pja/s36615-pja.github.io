<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Kontakt - Smocze Bestiarium</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="hero">
    <div class="hero-content">
        <h1>Kontakt</h1>
        <p>Napisz do mnie wiadomość, jeśli chcesz dodać własną legendę o smokach.</p>
    </div>
</header>

<nav class="main-nav">
    <a href="index.html">Strona główna</a>
    <a href="gatunki.html">Gatunki smoków</a>
    <a href="legendy.html">Legendy</a>
    <a href="kontakt.html">Kontakt</a>
</nav>

<main class="content">
    <section>
        <h2>Formularz kontaktowy</h2>

        <form action="#" method="post" class="contact-form">
            <label for="imie">Imię</label>
            <input type="text" id="imie" name="imie">

            <label for="email">E-mail</label>
            <input type="email" id="email" name="email">

            <label for="wiadomosc">Wiadomość</label>
            <textarea id="wiadomosc" name="wiadomosc" rows="5"></textarea>

            <button type="submit" class="btn-primary">Wyślij</button>
        </form>
    </section>

    <section>
        <h2>Inne informacje</h2>
        <p>Możesz tu dopisać też adres e-mail, link do mediów społecznościowych albo krótki opis strony.</p>
    </section>
</main>

<footer class="site-footer">
    <p>Autor: Mia Robert, nr studenta: 123456</p>
</footer>

</body>
</html>
